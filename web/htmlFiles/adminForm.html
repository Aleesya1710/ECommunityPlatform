<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Volunteer Form</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
    
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf2bb;
        }
        
        .btn-custom {
            background-color: #F7DE4F; 
            color: #1f2937; 
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-custom:hover {
            background-color: #F4D10B; 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    
    <div class="max-w-2xl mx-auto bg-white shadow-xl rounded-xl p-6 md:p-8">
    
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Create Volunteer Program</h1>
            <p class="text-gray-500 text-sm">Fill in the details below to publish a new opportunity.</p>
        </header>

        <form id="programForm" class="space-y-5">
            <input type="hidden" id="programId">
            
            <div>
                    <label for="title" class="block text-sm font-medium text-gray-700">Program Title</label>
                    <input type="text" id="title" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g., Beach Clean-Up" required>
            </div>
            
            <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500" placeholder="Provide a brief description of the activities and goals." required></textarea>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                        <label for="date" class="block text-sm font-medium text-gray-700">Date</label>
                        <input type="date" id="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500" required>
                </div>
                <div>
                        <label for="location" class="block text-sm font-medium text-gray-700">Location</label>
                        <input type="text" id="location" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g., City Center, School Hall" required>
                </div>
            </div>
            
            <div class="pt-4 flex justify-end space-x-3">
                <a href="listForm.jsp" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition duration-200">
                        Cancel
                </a>
                <button type="submit" id="saveButton" class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 transition duration-200">
                        Save 
                </button>
            </div>
        </form>
    </div>
</body>
</html>
